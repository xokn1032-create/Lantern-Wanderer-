<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#0b0818">
<title>Wanderer Pad</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(circle at 25% 85%,#2a1a55,#0b0818 70%);color:#fff;font-family:system-ui,sans-serif;touch-action:none;overscroll-behavior:none}
#L{position:fixed;left:0;top:0;width:55%;height:100%}
#base{display:none;position:fixed;width:120px;height:120px;border-radius:50%;border:2px solid #7af0ff88;background:#7af0ff14;pointer-events:none}
#knob{position:absolute;left:32px;top:32px;width:56px;height:56px;border-radius:50%;background:radial-gradient(#b8fbff,#3fc8dc);box-shadow:0 0 20px #7af0ff}
.b{position:fixed;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;border:3px solid #fff5}
#A{right:calc(8% + env(safe-area-inset-right));bottom:18%;width:96px;height:96px;background:#7a4dffcc;font-size:17px}
#B{right:calc(27% + env(safe-area-inset-right));bottom:8%;width:78px;height:78px;background:#ff5fa2cc;font-size:15px}
.on{transform:scale(.92);filter:brightness(1.4)}
#st{position:fixed;top:calc(10px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);padding:8px 14px;border-radius:20px;background:#000a;font-size:14px;white-space:nowrap}
#p{position:fixed;top:calc(56px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:#000d;padding:14px;border-radius:16px;text-align:center;display:none;font-size:14px;white-space:nowrap}
#p input{font:800 28px system-ui;width:5.5em;text-align:center;text-transform:uppercase;letter-spacing:6px;border-radius:10px;border:0;padding:6px;-webkit-user-select:text;user-select:text}
#p button{font:700 16px system-ui;margin-left:8px;padding:10px 14px;border:0;border-radius:10px;background:#7af0ff}
#h{display:none;position:fixed;bottom:12px;width:100%;text-align:center;font-size:14px;opacity:.7}
@media (orientation:portrait){#h{display:block}}
</style></head><body>
<div id="L"></div><div id="base"><div id="knob"></div></div>
<div class="b" id="B">Pulse</div><div class="b" id="A">Dash</div>
<div id="st">Tap here to enter the TV code</div>
<div id="p">Code shown on the TV<br><br><input id="i" maxlength="4" autocomplete="off" autocapitalize="characters"><button id="go">Go</button><br><br><small>Tip: Share → Add to Home Screen for full screen</small></div>
<div id="h">↻ Turn your phone sideways for the best controls</div>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.3.2/dist/peerjs.min.js"></script>
<script>
var $=function(i){return document.getElementById(i)},st={x:0,y:0,a:0,b:0},sid=null,ox=0,oy=0,code='',peer,conn,tm,ls='',hb=0,gen=0;
try{code=localStorage.getItem('lw')||''}catch(e){}
function say(t){$('st').textContent=t}
function retry(ms){clearTimeout(tm);tm=setTimeout(go,ms)}
function go(){code=($('i').value||code).toUpperCase().trim();
if(code.length<4){$('p').style.display='block';say('Enter the 4-letter TV code');return}
try{localStorage.setItem('lw',code)}catch(e){}
var me=++gen;say('Connecting to '+code+'…');if(peer)peer.destroy();peer=new Peer();
peer.on('open',function(){if(me!=gen)return;conn=peer.connect('lw-'+code,{serialization:'json'});
conn.on('open',function(){if(me!=gen)return;say('Connected ✓ '+code);$('p').style.display='none'});
conn.on('close',function(){if(me!=gen)return;say('Lost the TV, retrying…');retry(1500)})});
peer.on('error',function(){if(me!=gen)return;say('Looking for the TV… ('+code+')');retry(2500)})}
$('go').onclick=function(){go()};
$('st').onclick=function(){$('i').value='';$('p').style.display='block'};
if(code)go();else{$('p').style.display='block';say('Enter the 4-letter TV code')}
setInterval(function(){if(conn&&conn.open){var s=JSON.stringify(st);if(s!=ls||++hb>5){conn.send(st);ls=s;hb=0}}},33);
var base=$('base'),knob=$('knob'),L=$('L');
function mv(t){var dx=t.clientX-ox,dy=t.clientY-oy,d=Math.hypot(dx,dy),m=60;if(d>m){dx*=m/d;dy*=m/d}st.x=+(dx/m).toFixed(2);st.y=+(dy/m).toFixed(2);knob.style.transform='translate('+dx+'px,'+dy+'px)'}
L.addEventListener('touchstart',function(e){e.preventDefault();var t=e.changedTouches[0];sid=t.identifier;ox=t.clientX;oy=t.clientY;base.style.display='block';base.style.left=(ox-60)+'px';base.style.top=(oy-60)+'px';mv(t)},{passive:false});
L.addEventListener('touchmove',function(e){e.preventDefault();for(var i=0;i<e.changedTouches.length;i++)if(e.changedTouches[i].identifier==sid)mv(e.changedTouches[i])},{passive:false});
function end(e){for(var i=0;i<e.changedTouches.length;i++)if(e.changedTouches[i].identifier==sid){sid=null;st.x=st.y=0;knob.style.transform='';base.style.display='none'}}
L.addEventListener('touchend',end);L.addEventListener('touchcancel',end);
function btn(id,k){var el=$(id);el.addEventListener('touchstart',function(e){e.preventDefault();st[k]=1;el.classList.add('on')},{passive:false});
var u=function(e){e.preventDefault();st[k]=0;el.classList.remove('on')};el.addEventListener('touchend',u);el.addEventListener('touchcancel',u)}
btn('A','a');btn('B','b');
document.addEventListener('gesturestart',function(e){e.preventDefault()});
</script></body></html>
